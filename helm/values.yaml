# Default values for xray-mcp Helm chart.

replicaCount: 1

image:
  repository: ghcr.io/traveledge/xray-mcp
  tag: ""  # Defaults to chart appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: xray-mcp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: xray-mcp-tls
  #    hosts:
  #      - xray-mcp.example.com

# Gateway API route (alternative to Ingress). Attaches to an existing Gateway.
httpRoute:
  enabled: false
  gateway:
    name: ""
    namespace: ""
    sectionName: ""  # optional listener name (e.g. https)
  hostnames:
    - xray-mcp.example.com
  # Second route on the plain-HTTP listener that 301s to https
  httpsRedirect:
    enabled: false
    sectionName: http

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Pod disruption budget
pdb:
  enabled: true
  minAvailable: 1

# Xray configuration
xray:
  region: global
  credentialMode: strict

# OAuth sign-in for MCP clients that cannot send custom headers (Claude.ai, ChatGPT, Copilot connectors).
# Users sign in with their own Xray API key pair; nothing is stored server-side.
# Requires publicUrl and an OAUTH_ENCRYPTION_KEY (32 random bytes, base64: `openssl rand -base64 32`)
# supplied either via oauth.encryptionKey or the OAUTH_ENCRYPTION_KEY key of existingSecret.
oauth:
  enabled: false
  publicUrl: ""          # e.g. https://xray-mcp.example.com — must match how clients reach the server
  encryptionKey: ""      # only used when existingSecret is empty

# Existing secret name (for CSI Secret Store / External Secrets Operator).
# When set, chart does NOT create a Secret resource. The Deployment references this secret.
# The secret must contain XRAY_CLIENT_ID and XRAY_CLIENT_SECRET keys, plus OAUTH_ENCRYPTION_KEY when oauth.enabled.
existingSecret: ""

# Only used when existingSecret is empty. Chart creates a Secret with these values.
credentials:
  clientId: ""
  clientSecret: ""

# Additional environment variables as key-value pairs
env: {}

# Pod-level settings
nodeSelector: {}
tolerations: []
affinity: {}

# Liveness and readiness probes
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
