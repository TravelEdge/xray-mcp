name: Auto-Release on Version Bump

on:
  push:
    branches: [main]
    paths: ['package.json']

permissions:
  contents: read

jobs:
  detect:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        name: Compare package.json version against previous commit
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PREVIOUS=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || echo "")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "::notice::Version unchanged ($CURRENT) — no release."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --tags origin "refs/tags/v$CURRENT" | grep -q .; then
            echo "::notice::Tag v$CURRENT already exists — skipping release."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Version bump detected: ${PREVIOUS:-<none>} -> $CURRENT. Releasing v$CURRENT."
          echo "should-release=true" >> "$GITHUB_OUTPUT"

  tag:
    name: Create and push tag
    needs: detect
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag and push
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

  publish-npm:
    name: Publish to npm
    needs: [detect, tag]
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.detect.outputs.version }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    name: Publish to GHCR
    needs: [detect, tag]
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.detect.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/traveledge/xray-mcp
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.detect.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.detect.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
